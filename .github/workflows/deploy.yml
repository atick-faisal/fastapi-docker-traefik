  deploy-cloud-run:
    name: ☁️ Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 🔐 Google Auth (WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: 🚀 Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        env:
          IMAGE_LATEST: ${{ needs.build-and-push.outputs.gar_latest }}
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY_NAME }}/${{ env.SERVICE }}:latest
          flags: |
            --allow-unauthenticated
            --cpu=1
            --memory=512Mi
            --max-instances=10
            --min-instances=0
            --port=8080
            --concurrency=100
            --timeout=300s
            --execution-environment=gen2

      - name: 🌐 URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
          echo "Cloud Run Service: ${{ env.SERVICE }}"
          echo "Region: ${{ env.REGION }}"